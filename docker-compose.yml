services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: finance_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finance-tracker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_tracker -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance-tracker-postgres:
