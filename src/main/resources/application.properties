spring.application.name=personal-finance-tracker
spring.config.import=classpath:transaction-categories.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker}
spring.datasource.username=${DB_USERNAME:finance_tracker}
spring.datasource.password=${DB_PASSWORD:finance_tracker}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/finance}
